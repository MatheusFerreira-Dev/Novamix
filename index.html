<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />

    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- SEO local -->
    <meta name="geo.region" content="BR-SP" />
    <meta name="geo.placename" content="Jarinu" />

    <!-- Google Search Console (verificação por meta tag, opcional) -->
    __GSC_META__

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Novamix Center" />
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo da Novamix Center Troca de Óleo, em Jarinu - SP" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__TITLE__" />
    <meta name="twitter:description" content="__DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- logo da abertura: é o primeiro conteúdo da página, então tem prioridade máxima -->
    <link rel="preload" as="image" href="/logo-830.webp" type="image/webp" fetchpriority="high" />
    <!-- poster do vídeo do Hero: só aparece depois da abertura, então não disputa banda com a logo -->
    <link rel="preload" as="image" href="/video-fachada-poster.jpg" fetchpriority="low" />

    <!-- Fontes: o CSS carrega sem bloquear a primeira renderização -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      />
    </noscript>

    <noscript><style>#splash{display:none}</style></noscript>

    <!-- Dados estruturados (gerados no build a partir de src/config e src/data) -->
    <script type="application/ld+json">__JSON_LD__</script>
  </head>
  <body>
    <!-- Abertura (preto → logo → fade → site). Fica fora do #root: o React nunca a recria, então não piscam LCP/FCP. -->
    <div id="splash" style="position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#000" aria-hidden="true">
      <img id="splash-logo" src="/logo-830.webp" alt="" width="830" height="210" style="width:min(78vw,26rem);height:auto" fetchpriority="high" />
    </div>
    <script>
      (function () {
        var el = document.getElementById("splash"), img = document.getElementById("splash-logo");
        if (!el) return;
        var done = false;
        function finish() {
          window.__splashDone = true;
          window.dispatchEvent(new Event("splash:done"));
        }
        function hide() {
          if (done) return;
          done = true;
          el.style.transition = "opacity .5s ease-in-out";
          el.style.opacity = "0";
          setTimeout(function () { el.remove(); finish(); }, 500);
        }
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        function start() { setTimeout(hide, reduced ? 250 : 900); }
        // o tempo de exibição conta a partir do momento em que a logo aparece
        if (img.complete) start(); else img.addEventListener("load", start, { once: true });
        setTimeout(hide, 4000); // segurança: nunca prende a tela
      })();
    </script>
    <div id="root"></div>
    </div>
    <noscript>
      <h1>Troca de óleo em Jarinu - SP | Novamix Center</h1>
      <p>
        Troca de óleo, filtros, lubrificantes e acessórios automotivos. R. Ver. Hermínio Contesini, 222, Centro, Jarinu - SP.
        WhatsApp: (11) 99958-0158. Ative o JavaScript para ver o site completo.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
